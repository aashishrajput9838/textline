<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textline AI - Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --bg-color: #07090e;
            --panel-bg: #0b0f19;
            --panel-border: #161f30;
            --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --status-idle: #64748b;
            --status-success: #10b981;
            --status-error: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-muted);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header Bar */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid #141b2d;
            background-color: #090d16;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: var(--accent-gradient);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
        }

        .brand-title {
            font-size: 17px;
            font-weight: 700;
            color: #f8fafc;
            line-height: 1.2;
        }

        .brand-subtitle {
            font-size: 12px;
            color: #64748b;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #34d399;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .status-dot.offline {
            background-color: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        /* App Layout */
        .layout {
            display: flex;
            flex: 1;
            padding: 24px;
            gap: 24px;
            max-width: 1440px;
            margin: 0 auto;
            width: 100%;
        }

        /* Persistent Sidebar */
        .sidebar {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: sticky;
            top: 80px;
            height: fit-content;
        }

        .nav-category {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #475569;
            margin-bottom: 8px;
            padding-left: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            background: #111726;
            color: #f1f5f9;
        }

        .nav-item.active {
            background: linear-gradient(90deg, #1e1b4b, #2e1065);
            border: 1px solid #4338ca;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(67, 56, 202, 0.2);
            font-weight: 600;
        }

        /* Main Content Container */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        /* Panels & Cards */
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .timestamp {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #64748b;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0e1422;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #192338;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #f1f5f9;
            font-weight: 500;
            flex-wrap: wrap;
        }

        .status-badge {
            background: #1e293b;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .status-badge.processing { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .status-badge.success { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .status-badge.error { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .active-route-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #161e31;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .active-route-label {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 0.04em;
        }

        .active-route-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #e2e8f0;
            font-weight: 600;
        }

        .pipeline-container {
            background: #06080d;
            border: 1px solid #141b2a;
            border-radius: 8px;
            overflow: hidden;
        }

        .pipeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #141b2a;
            background: #090d16;
        }

        .pipeline-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #e2e8f0;
        }

        .pipeline-id-badge {
            background: #1e1b4b;
            color: #818cf8;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .btn-action {
            background: #131b2e;
            border: 1px solid #23304c;
            color: #94a3b8;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .btn-action:hover {
            background: #1e293b;
            color: #f1f5f9;
        }

        .pipeline-log-console {
            max-height: 240px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            padding: 12px;
            color: #64748b;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            background: #06080d;
        }

        .pipeline-log-entry {
            display: flex;
            align-items: flex-start;
            gap: 0.4rem;
        }

        .pipeline-log-entry.success { color: #34d399; }
        .pipeline-log-entry.running { color: #60a5fa; }
        .pipeline-log-entry.info { color: #cbd5e1; }
        .pipeline-log-entry.warning { color: #fbbf24; }
        .pipeline-log-entry.error { color: #f87171; font-weight: 600; }

        .pipeline-summary-banner {
            margin-top: 0.5rem;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 700;
            text-align: center;
        }

        .pipeline-summary-banner.success { background: rgba(52, 211, 153, 0.15); color: #34d399; }
        .pipeline-summary-banner.error { background: rgba(248, 113, 113, 0.15); color: #f87171; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .grid-2 { grid-template-columns: 1fr; }
            .layout { flex-direction: column; padding: 16px; }
            .sidebar { width: 100%; flex-direction: row; overflow-x: auto; position: sticky; top: 70px; z-index: 90; background: #07090e; padding-bottom: 8px; }
            .nav-category { display: none; }
        }

        .preview-box {
            min-height: 240px;
            max-height: 380px;
            border: 1px dashed #1e293b;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: #080c14;
            overflow: hidden;
            position: relative;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 380px;
            object-fit: contain;
            border-radius: 8px;
            display: none;
        }

        .preview-placeholder-text {
            font-size: 12px;
            color: #64748b;
            line-height: 1.6;
        }

        .answer-box {
            min-height: 240px;
            border: 1px solid #141b2a;
            background: #080c14;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* 400px Direct Answer Scrollbar Contract */
        .answer-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #60a5fa;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .answer-text::-webkit-scrollbar { width: 6px; }
        .answer-text::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 4px; }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
            transition: opacity 0.15s ease;
        }

        .btn-primary:hover { opacity: 0.9; }

        /* API Key Health Table & Summary */
        .health-summary-bar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            background: #0e1422;
            border: 1px solid #192338;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
        }

        .summary-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 11px;
        }

        .summary-pill.total { background: rgba(255, 255, 255, 0.08); color: #f3f4f6; }
        .summary-pill.working { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .summary-pill.quota { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .summary-pill.unavailable { background: rgba(239, 68, 68, 0.15); color: #f87171; }

        .key-health-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: left;
        }

        .key-health-table th {
            padding: 8px 12px;
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase;
            border-bottom: 1px solid #1e293b;
        }

        .key-health-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        tr.key-group-row td {
            background: rgba(99, 102, 241, 0.08) !important;
            color: #818cf8;
            font-weight: 700;
        }

        .badge-status {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-status.working { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .badge-status.quota, .badge-status.unavailable { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .badge-status.error { background: rgba(239, 68, 68, 0.15); color: #f87171; }

        /* Usage Tracker Styles */
        .usage-tracker-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .usage-key-card {
            background: #080c14;
            border: 1px solid #141b2a;
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .usage-key-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .usage-key-id {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            color: #818cf8;
            font-size: 13px;
        }

        .usage-progress-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .usage-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #818cf8);
            border-radius: 4px;
        }

        .usage-progress-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #64748b;
        }

        /* Session History List */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
        }

        .history-item {
            background: #080c14;
            border: 1px solid #141b2a;
            padding: 12px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .history-content {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #f1f5f9;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .history-time {
            font-size: 11px;
            color: #64748b;
            white-space: nowrap;
        }

        /* Provenance Badge Container */
        .provenance-container {
            margin-top: 1rem;
            padding: 12px;
            background: #080c14;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .provenance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            font-size: 11px;
        }

        .prov-badge {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <!-- Persistent Header Bar -->
    <header class="app-header">
        <div class="brand">
            <div class="brand-icon">✦</div>
            <div>
                <div class="brand-title">Textline AI</div>
                <div class="brand-subtitle">Clipboard Screenshot to Gemini AI Automation</div>
            </div>
        </div>
        <div class="status-pill">
            <div id="connection-dot" class="status-dot"></div>
            <span id="connection-text">Live Connected</span>
        </div>
    </header>

    <!-- App Multi-Route Layout -->
    <div class="layout">
        <!-- Persistent Left Sidebar Navigation -->
        <aside class="sidebar">
            <div class="nav-category">NAVIGATE</div>
            <a href="/monitor" class="nav-item {% if active_page == 'monitor' %}active{% endif %}">⚡ Monitor</a>
            <a href="/health" class="nav-item {% if active_page == 'health' %}active{% endif %}">🔑 API Health</a>
            <a href="/usage" class="nav-item {% if active_page == 'usage' %}active{% endif %}">📊 API Usage</a>
            <a href="/history" class="nav-item {% if active_page == 'history' %}active{% endif %}">📜 History</a>
        </aside>

        <!-- Main Route Content Container -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Universal Real-Time Socket.IO & Controller Scripts -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/ui_controller.js') }}"></script>
    <script src="{{ url_for('static', filename='js/socket_events.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
